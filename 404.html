<!DOCTYPE html>
<html>

    <meta charset="utf-8">
    <script>
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var url = path + search + hash;
      sessionStorage.setItem('redirect', url);
      window.location.replace('/DSS-Website-Portfolio/');
    </script>
  </head>

</html>
