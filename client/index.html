    <style>
      /* Thmanyah Serif Display */
      @font-face {
        font-family: "thmanyah serif display-Medium";
        src: url("/woff2 Thmanyah fonts/thmanyahserifdisplay-Medium.woff2") format("woff2"),
             local("thmanyah serif display-Medium"),
             local("ThmanyahSerifDisplay-Medium");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
        font-feature-settings: "salt" 1, "ss01" 1, "calt" 1, "liga" 1;
      }

      @font-face {
        font-family: "thmanyah serif display-Bold";
        src: url("/woff2 Thmanyah fonts/thmanyahserifdisplay-Bold.woff2") format("woff2"),
             local("thmanyah serif display-Bold"),
             local("ThmanyahSerifDisplay-Bold");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        font-feature-settings: "salt" 1, "ss01" 1, "calt" 1, "liga" 1;
      }

      /* Apply stylistic alternates globally to all thmanyah text */
      [style*="thmanyah"], .thmanyah {
        font-feature-settings: "salt" 1, "ss01" 1, "calt" 1, "liga" 1;
        -webkit-font-feature-settings: "salt" 1, "ss01" 1, "calt" 1, "liga" 1;
      }

      /* Fallback: use IBM Plex Sans Arabic when thmanyah is not available */
      body {
        font-family: "thmanyah serif display-Medium", "IBM Plex Sans Arabic", "Amiri", "Noto Naskh Arabic", sans-serif;
      }
